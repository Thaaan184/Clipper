name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          cd backend
          pip install flake8
          # Syntax check
          python -m py_compile main.py config.py db.py models.py
          python -m py_compile services/*.py workers/*.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & build frontend
        run: |
          cd frontend
          npm install
          npm run build
