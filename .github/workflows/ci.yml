name: CI

on:
  push:
    branches: [main, feat/*, chore/*]
  pull_request:
    branches: [main]

jobs:
  lint-and-test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg with libass
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev fonts-dejavu-core

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        working-directory: apps/api
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: apps/api
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        working-directory: apps/api
        run: |
          source .venv/bin/activate
          mypy src/clipforge/core src/clipforge/jobs src/clipforge/db src/clipforge/api

      - name: Run Pytest
        working-directory: apps/api
        run: |
          source .venv/bin/activate
          pytest -v

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web
        working-directory: apps/web
        run: npm run build
