services:
  clipforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipforge
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - clipforge-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  clipforge-data:
    driver: local
