services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - CF_DATA_DIR=/app/data
      - CF_DB_PATH=/app/data/clipforge.db
      - CF_BIND=0.0.0.0
      - CF_PORT=8000
      - CF_ALLOWED_HOSTS=youtube.com,www.youtube.com,m.youtube.com,youtu.be
    volumes:
      - clipforge_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clipforge_data:
